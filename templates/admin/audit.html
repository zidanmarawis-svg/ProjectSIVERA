{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h3 class="fw-bold">Audit Log Sistem</h3>
  <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary">&larr; Kembali</a>
</div>

<div class="card shadow-sm border-0" style="border-radius: 15px;">
  <div class="card-body p-0">
    <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
      <table class="table table-hover table-striped mb-0">
        <thead class="table-dark sticky-top">
          <tr>
            <th>Waktu</th>
            <th>User ID</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody>
          {% for l in logs %}
          <tr>
            <td class="text-muted small">{{ l.waktu.strftime('%Y-%m-%d %H:%M:%S') }}</td>
            <td><span class="badge bg-secondary">User #{{ l.user_id }}</span></td>
            <td>{{ l.aksi }}</td>
          </tr>
          {% else %}
          <tr>
            <td colspan="3" class="text-center py-4 text-muted">Belum ada aktivitas.</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
