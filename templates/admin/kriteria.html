{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold">Kelola Kriteria & Bobot SAW</h3>
      <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary">&larr; Kembali</a>
    </div>
    
    <div class="alert alert-info border-0 shadow-sm" style="border-radius: 10px;">
      <strong>Perhatian:</strong> Total keseluruhan bobot harus berjumlah tepat <b>1.0</b>. Jika tidak, sistem akan menolak perubahan.
    </div>

    <div class="card shadow-sm border-0" style="border-radius: 15px;">
      <div class="card-body p-4">
        <form method="post">
          <table class="table table-borderless align-middle">
            <thead class="table-light">
              <tr>
                <th>Nama Kriteria</th>
                <th width="20%">Bobot</th>
                <th width="30%">Tipe</th>
              </tr>
            </thead>
            <tbody>
              {% for k in daftar %}
              <tr>
                <td class="fw-bold">{{ k.nama|capitalize }}</td>
                <td><input class="form-control" type="number" step="0.01" name="bobot_{{ k.id }}" value="{{ k.bobot }}" required></td>
                <td>
                  <select class="form-select" name="tipe_{{ k.id }}">
                    <option value="benefit" {% if k.tipe=='benefit' %}selected{% endif %}>Benefit (Semakin besar semakin baik)</option>
                    <option value="cost" {% if k.tipe=='cost' %}selected{% endif %}>Cost (Semakin kecil semakin baik)</option>
                  </select>
                </td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
          <div class="d-grid mt-4">
            <button class="btn btn-primary btn-lg">Simpan Perubahan</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
